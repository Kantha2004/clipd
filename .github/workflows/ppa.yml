name: PPA Upload

on:
  push:
    tags:
      - 'v*'
      - 'beta-v*'

jobs:
  ppa:
    name: Upload source package to Launchpad PPA (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [noble, resolute]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: Install packaging tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y \
            build-essential golang-any \
            devscripts debhelper dput fakeroot \
            libgl-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev \
            libxi-dev libxxf86vm-dev

      - name: Configure dput
        run: |
          cat << 'EOF' > ~/.dput.cf
          [DEFAULT]
          default_host_main = ppa

          [ppa]
          fqdn = ppa.launchpad.net
          method = ftp
          incoming = ~%(ppa)s/ubuntu
          login = anonymous
          allow_unsigned_uploads = 0
          passive_ftp = 1
          EOF

      # Handles gpg-agent setup for non-interactive signing in CI.
      - name: Import GPG signing key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Extract version from tag
        id: version
        run: |
          REF="${GITHUB_REF_NAME}"
          if [[ "$REF" == beta-v* ]]; then
            VERSION="${REF#beta-v}~beta"
          else
            VERSION="${REF#v}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and upload source package
        env:
          DEBSIGN_KEYID: ${{ steps.import-gpg.outputs.fingerprint }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          SUITE="${{ matrix.suite }}"
          echo "========================================="
          echo "Processing suite: $SUITE"
          echo "========================================="
          
          # Format: version~suite-1 (e.g. 1.1.8-8~beta~noble-1)
          STAMPED_VERSION="${VERSION}~${SUITE}-1"
          
          # Replace version inside parentheses and the suite name
          sed -i "1s/([^)]*)/(${STAMPED_VERSION})/; 1s/) [a-z0-9-]*;/) ${SUITE};/" debian/changelog
          
          # Build the source package using the suite-specific upstream version
          make source VERSION="${VERSION}~${SUITE}"
          
          # Upload using dput with retry logic
          MAX_RETRIES=3
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt of $MAX_RETRIES to upload..."
            if dput ppa:kantha2004/clipd ../clipd_${STAMPED_VERSION}_source.changes; then
              echo "Upload succeeded!"
              break
            fi
            if [ $attempt -eq $MAX_RETRIES ]; then
              echo "Failed to upload after $MAX_RETRIES attempts."
              exit 1
            fi
            echo "Upload failed, retrying in 15 seconds..."
            sleep 15
          done
